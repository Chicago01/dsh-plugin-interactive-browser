name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8'))"
      - name: Locale files are valid JSON
        run: |
          for f in locale/*.json; do node -e "JSON.parse(require('node:fs').readFileSync('$f','utf8'))"; done
